name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salud
          POSTGRES_PASSWORD: salud
          POSTGRES_DB: medicita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salud -d medicita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salud:salud@localhost:5432/medicita_test?schema=public
      TEST_DATABASE_URL: postgresql://salud:salud@localhost:5432/medicita_test?schema=public
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
